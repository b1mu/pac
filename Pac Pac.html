<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pac Pac</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 16 L29 8.5 A15 15 0 1 0 29 23.5 Z' fill='%23f1c40f'/%3E%3Ccircle cx='15' cy='9' r='2' fill='%23000'/%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#05050d;--fg:#f4efe0;--btn:#1a1a38;--accent:#f1c40f;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#1a1040,var(--bg) 70%) fixed;color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:max(320px,min(560px,calc((100vh - 200px)*.905)));margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
#hud{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:15px;text-shadow:0 0 8px var(--accent)}
#hud button{background:var(--btn);color:var(--fg);border:0;border-radius:8px;padding:4px 10px;font-size:16px}
#bars{width:100%;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:11px;font-weight:bold;letter-spacing:1px}
.bar{height:12px;background:#111;border:2px solid #4a4a6a;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .25s,background .3s}
#wrap{position:relative;width:100%}
canvas#c{width:100%;aspect-ratio:456/504;background:#000;border-radius:10px;touch-action:none;display:block;box-shadow:0 0 24px #3a2aa066}
#menu{position:absolute;inset:0;background:rgba(5,5,18,.94);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;text-align:center}
h1{margin:0;font-size:40px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 12px var(--accent),0 0 30px #f39c12;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 22px var(--accent),0 0 50px #f39c12;transform:scale(1.04)}}
#chars{display:flex;gap:6px;width:100%}
#chars button{flex:1;background:var(--btn);color:var(--fg);border:2px solid transparent;border-radius:10px;padding:10px 2px;font:inherit;font-size:12px}
#chars button.on{border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
.row{display:flex;gap:10px;align-items:center;font-size:13px}
.row input[type=color]{width:48px;height:34px;border:0;background:none;padding:0}
select{background:var(--btn);color:var(--fg);border:0;border-radius:8px;padding:8px;font:inherit}
#play{background:var(--accent);color:#000;border:0;border-radius:14px;padding:14px 46px;font:bold 22px ui-monospace,Menlo,monospace;letter-spacing:3px;box-shadow:0 0 20px var(--accent);animation:pulse 1.2s ease-in-out infinite}
#pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,52px);gap:6px}
#pad button{background:var(--btn);color:var(--fg);border:0;border-radius:12px;font-size:22px}
#pad button:active{background:var(--accent);color:#000;box-shadow:0 0 14px var(--accent)}
small{opacity:.6;text-align:center}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="sc"></span><span id="lv"></span><span id="li"></span><button id="menuBtn">☰</button></div>
  <div id="bars">
    <span>POWER</span><div class="bar"><i id="pw"></i></div>
    <span>CLEAR</span><div class="bar"><i id="xp" style="background:#3498db"></i></div>
  </div>
  <div id="wrap">
    <canvas id="c" width="456" height="504"></canvas>
    <div id="menu">
      <h1>PAC PAC</h1>
      <canvas id="pv" width="80" height="80"></canvas>
      <div id="chars">
        <button data-c="chomper" class="on">Chomper</button>
        <button data-c="ms">Ms. Chomper</button>
        <button data-c="cookie">Cookie Man</button>
      </div>
      <div class="row"><label for="col">Color</label><input type="color" id="col" value="#f1c40f">
        <label for="lvsel">Level</label>
        <select id="lvsel"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></div>
      <button id="play">PLAY</button>
    </div>
  </div>
  <div id="pad">
    <span></span><button data-d="0">▲</button><span></span>
    <button data-d="1">◀</button><button data-d="2">▼</button><button data-d="3">▶</button>
  </div>
  <small>Arrow keys / WASD, swipe, on-screen arrows, or a controller. Enter = start, P = pause</small>
</div>
<script>

{t:["##########","#o..#.....","#.##.#.##.","#.........","#.#####.#.","#.......#."],b:["#.......#.","#.#####.#.","#o.......P","#.##.#.##.","#.........","#o..#.....","#.........","##########"]},
{t:["##########","#....#....","#.##.#.##.","#o........","#.##.##.#.","#....#...."],b:["#....#....","#.##.#.##.","#.#......P","#o##.##.#.","#.........","#.##.#.##.","#.........","##########"]},

    if(arrive)arrive(e);

function pChoose(e){

  if(!canGo(e.x,e.y,[e.dx,e.dy],false)){e.dx=0;e.dy=0}}

  else if(c=="o"){score+=50;dots--;frMax=fright=FT[Math.min(level,19)-1];combo=0;zoomP=1;stall=.05;ghosts.forEach(function(q){q.fr=!q.eyes});revGhosts();

function restart(l){level=l;score=0;lives=3;gotLife=false;buildGrid();resetPos();state="ready";seq([494,988,740,622,988,740,622,523,1046,784,659,1046,784,659],85)}

  g.fillStyle="#04040c";g.fillRect(0,0,456,504);
  var ax=(pac.x+pac.dx*pac.p)*S+S/2,ay=(pac.y+pac.dy*pac.p)*S+S/2,z=1+zoomP*.14;
  g.translate((Math.random()-.5)*shake*9,(Math.random()-.5)*shake*9);
  g.translate(ax,ay);g.scale(z,z);g.translate(-ax,-ay);
  g.drawImage(wc,0,0);
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var c=grid[y][x];
    if(c=="."){g.fillStyle="#ffe9c0";g.beginPath();g.arc(x*S+S/2,y*S+S/2,2.4,0,7);g.fill()}
    else if(c=="o"){var pr0=6+Math.sin(t*8)*1.8,cx0=x*S+S/2,cy0=y*S+S/2,gr=g.createRadialGradient(cx0-pr0*.35,cy0-pr0*.35,1,cx0,cy0,pr0);gr.addColorStop(0,"#fff");gr.addColorStop(.5,"#9fe0ff");gr.addColorStop(1,"#1e6fff");g.shadowColor="#7fd4ff";g.shadowBlur=16;g.fillStyle=gr;g.beginPath();g.arc(cx0,cy0,pr0,0,7);g.fill();g.shadowBlur=0}}
  if(state!="dying"||pause>.7){
    var m=(pac.dx||pac.dy)?.08+.3*Math.abs(Math.sin(t*14)):.25;
    g.shadowColor=pacCol;g.shadowBlur=18;drawPac(g,ax,ay,face,m,S*.45)}
  else{var k=Math.max(0,pause/.7);g.shadowColor=pacCol;g.shadowBlur=18;drawPac(g,pac.x*S+S/2,pac.y*S+S/2,-Math.PI/2,(1-k)*3,S*.45)}
  if(fruit){g.globalAlpha=fruit.l<2&&Math.floor(t*8)%2?.3:1;g.font="20px serif";g.textAlign="center";g.shadowColor="#ffd24a";g.shadowBlur=14;g.fillText(FE[Math.min(level,13)-1],228,11*S+19+Math.sin(t*6)*2);g.shadowBlur=0;g.globalAlpha=1}
  if(state!="dying")ghosts.forEach(ghostShape);
  rings.forEach(function(q){g.globalAlpha=q.l/q.ml;g.strokeStyle="#9fe0ff";g.lineWidth=3;g.shadowColor="#7fd4ff";g.shadowBlur=14;g.beginPath();g.arc(q.x,q.y,q.r,0,7);g.stroke()});
  g.shadowBlur=0;
  orbs.forEach(function(o){
    var k=1-o.l/o.ml,R=18+k*70,a0=t*7;
    for(var rg=0;rg<2;rg++){
      var tilt=rg?1+Math.sin(t*3):-.9+Math.cos(t*3);
      for(var i=0;i<12;i++){
        var a=a0*(rg?-1:1)+i*Math.PI/6,z0=Math.sin(a)*R,x=Math.cos(a)*R,y=z0*Math.sin(tilt),z=z0*Math.cos(tilt),sc=300/(300-z);
        var rx=o.x+x*sc,ry=o.y+y*sc,rr=3.4*sc,q=g.createRadialGradient(rx-rr*.3,rr*0+ry-rr*.3,rr*.1,rx,ry,rr);
        q.addColorStop(0,"#fff");q.addColorStop(1,rg?"#4aa8ff":"#7fffd0");
        g.globalAlpha=Math.max(0,o.l/o.ml)*Math.min(1,.4+sc*.3);g.fillStyle=q;g.shadowColor="#7fd4ff";g.shadowBlur=10;
        g.beginPath();g.arc(rx,ry,rr,0,7);g.fill()}}});
  g.shadowBlur=0;g.globalAlpha=1;
  parts.forEach(function(p){g.globalAlpha=Math.max(0,p.l/p.ml);g.fillStyle=p.c;g.shadowColor=p.c;g.shadowBlur=8;g.beginPath();g.arc(p.x,p.y,2.6,0,7);g.fill()});
  g.shadowBlur=0;g.globalAlpha=1;
  pops.forEach(function(p){g.globalAlpha=Math.min(1,p.l/p.ml*1.6);g.font="bold "+(p.big?17:15)+"px ui-monospace,Menlo,monospace";g.textAlign="center";g.fillStyle=p.big?"#9fe0ff":"#fff";g.shadowColor=p.big?"#2aa8ff":"#6cf";g.shadowBlur=10;if(p.big){g.save();g.translate(p.x,p.y);g.scale(Math.max(.08,Math.abs(Math.cos((1-p.l/p.ml)*7))),1);g.fillText(p.txt,0,0);g.restore()}else g.fillText(p.txt,p.x,p.y)});
  g.shadowBlur=0;g.globalAlpha=1;g.setTransform(1,0,0,1,0,0);
  if(fright>0){g.fillStyle="rgba(40,90,255,"+(.07+.04*Math.sin(t*10))+")";g.fillRect(0,0,456,504)}
  if(state=="win"&&Math.floor(t*9)%2){g.fillStyle="rgba(255,255,255,.2)";g.fillRect(0,0,456,504)}
  if(state=="ready"){g.fillStyle="rgba(0,0,0,.55)";g.fillRect(0,12*S-34,456,76);big("LEVEL "+level,12*S+2,30+Math.sin(t*5)*2,pacCol);big("SWIPE TO GO",12*S+30,16,"#fff")}
  if(state=="over"){g.fillStyle="rgba(0,0,0,.65)";g.fillRect(0,12*S-34,456,76);big("GAME OVER",12*S+2,32,"#ff4a3d");big("TAP TO RETRY",12*S+30,16,"#fff")}
  if(state=="win")big("LEVEL CLEAR!",12*S+10,30,"#7fffa0");
  if(state=="pause"){g.fillStyle="rgba(0,0,0,.6)";g.fillRect(0,0,456,504);big("PAUSED",12*S,34,"#fff");big("PRESS ANY ARROW",12*S+30,15,"#aaa")}
  var pr=fright>0?fright/frMax:0;
  $("pw").style.width=pr*100+"%";$("pw").style.background=pr>.5?"#3ddc5a":pr>.2?"#f5c518":"#ff4a3d";
  $("xp").style.width=(1-dots/total)*100+"%";
  cv.style.transform="perspective(900px) rotateX("+zoomP*16+"deg) rotateY("+(Math.sin(t*12)*zoomP*7+(state=="win"?(1.6-pause)*225:0))+"deg) scale("+(1+zoomP*.03)+")";
  if(score>hi){hi=score;try{localStorage.setItem("chomperhi",hi)}catch(e){}}
  $("sc").textContent="Score "+score+"  HI "+hi;$("lv").textContent="Lv "+level+" "+FE[Math.min(level,13)-1];
  $("li").textContent=lives>0?new Array(lives+1).join("♥"):"–"}
try{hi=+localStorage.getItem("chomperhi")||0}catch(e){}
var last=0,pc=$("pv").getContext("2d");
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;pollPad();
  if(state=="menu"){t+=dt;pc.clearRect(0,0,80,80);pc.shadowColor=pacCol;pc.shadowBlur=16;drawPac(pc,40,42,0,.1+.3*Math.abs(Math.sin(t*6)),26)}
  else update(dt);
  draw();requestAnimationFrame(loop)}
var DEF={chomper:"#f1c40f",ms:"#f1c40f",cookie:"#d9a05b"};
document.querySelectorAll("#chars button").forEach(function(b){
  b.addEventListener("click",function(){
    ch=b.dataset.c;pacCol=DEF[ch];$("col").value=pacCol;beep(500,.06);b.blur();
    document.querySelectorAll("#chars button").forEach(function(o){o.classList.toggle("on",o==b)})})});
$("col").addEventListener("input",function(e){pacCol=e.target.value});
$("play").addEventListener("click",function(){restart(+$("lvsel").value);$("menu").style.display="none"});
$("menuBtn").addEventListener("click",function(){state="menu";$("menu").style.display="flex"});
document.querySelectorAll("#pad button").forEach(function(b){
  b.addEventListener("pointerdown",function(){input(+b.dataset.d)})});
var sx,sy;
cv.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;if(state=="over")input(0)});
cv.addEventListener("pointerup",function(e){
  var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(Math.abs(dx)>Math.abs(dy))input(dx<0?1:3);else input(dy<0?0:2)});
var KM={ArrowUp:0,KeyW:0,ArrowLeft:1,KeyA:1,ArrowDown:2,KeyS:2,ArrowRight:3,KeyD:3};
function startKey(){
  if(state=="menu")$("play").click();
  else if(state=="over")restart(1);
  else if(state=="ready"||state=="pause")state="play"}
document.addEventListener("keydown",function(e){
  var tg=e.target.tagName;if(tg=="SELECT"||tg=="INPUT")return;
  var i=KM[e.code];
  if(i!==undefined){e.preventDefault();input(i);return}
  if(e.code=="Enter"||e.code=="Space"){if(tg=="BUTTON")return;e.preventDefault();startKey()}
  else if(e.code=="KeyP"||e.code=="Escape"){if(state=="play")state="pause";else if(state=="pause")state="play"}});
document.addEventListener("visibilitychange",function(){if(document.hidden&&state=="play")state="pause"});
var gpPrev=[];
function pollPad(){
  var pads=navigator.getGamepads?navigator.getGamepads():[];
  for(var k=0;k<pads.length;k++){
    var p=pads[k];if(!p)continue;
    function bt(n){return p.buttons[n]&&p.buttons[n].pressed}
    var d=-1;
    if(bt(12))d=0;else if(bt(14))d=1;else if(bt(13))d=2;else if(bt(15))d=3;
    else{var ax=p.axes[0]||0,ay=p.axes[1]||0;
      if(Math.abs(ax)>.5||Math.abs(ay)>.5)d=Math.abs(ax)>Math.abs(ay)?(ax<0?1:3):(ay<0?0:2)}
    if(d>=0)input(d);
    var st=bt(0)||bt(9);
    if(st&&!gpPrev[k])startKey();
    gpPrev[k]=st}}
buildGrid();resetPos();requestAnimationFrame(loop);
</script>
